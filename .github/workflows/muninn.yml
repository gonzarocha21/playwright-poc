name: Muninn Security Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

concurrency:
  group: muninn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  muninn:
    name: Muninn
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Muninn
        # zizmor: ignore[unverified_creator]
        uses: skaldlab/muninn@dfbf06a4e2ab86298040a86672501a5dea132a38 # v0.3.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: info
          config: muninn.yml
          format: sarif,comment

      - name: Upload SARIF
        if: ${{ always() && hashFiles('muninn.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: muninn.sarif
