name: Muninn Security Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

concurrency:
  group: muninn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  muninn:
    name: Muninn
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Muninn
        # zizmor: ignore[unverified_creator]
        uses: skaldlab/muninn@269494d4517141eda9467d5cf94e35e2ec49b9b7 # v0.3.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: info
          config: muninn.yml
          format: sarif,comment

      - name: Upload SARIF
        if: ${{ always() && hashFiles('muninn.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: muninn.sarif
