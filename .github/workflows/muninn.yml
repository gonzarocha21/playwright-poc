name: Muninn Security Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

concurrency:
  group: muninn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  muninn:
    name: Muninn
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Muninn
        # zizmor: ignore[unverified_creator]
        uses: skaldlab/muninn@e9f71d6613d4ea73f144cffb6f53ef2f23f9c069 # v0.3.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: info
          config: muninn.yml
          format: sarif,comment

      - name: Upload SARIF
        if: ${{ always() && hashFiles('muninn.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: muninn.sarif
